[package]
name = "coll-birth"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
authors = [
	"Sebastiano Vigna <sebastiano.vigna@unimi.it>",
]
description = "Large-scale collision and birthday-spacings tests for pseudorandom number generators"
repository = "https://github.com/vigna/coll-birth-rs"
license = "Apache-2.0 OR MIT"
readme = "README.md"
categories = ["algorithms", "mathematics", "command-line-utilities"]
keywords = ["collision", "birthday-spacings", "prng", "testing", "statistics"]
exclude = ["aws.sh"]

[package.metadata.docs.rs]
features = ["incr"]

[dependencies]
rayon = "1"
clap = { version = "4.1.6", features = ["derive", "wrap_help"] }
mmap-rs = "0.7.0"
bytemuck = "1.13.1"
num = { version = "0.4.0", features = ["num-bigint"] }
voracious_radix_sort = { version = "1.2.0", features = ["rayon", "voracious_multithread"] }
cdflib = "0.4.2"

[dev-dependencies]
anyhow = "1.0.79"

[profile.release]
lto = "fat"
opt-level = 3
panic = "abort"
codegen-units = 1

# Each feature corresponds to a PRNG defined in the prng module. Every PRNG feature
# enables the internal _prng marker, which lets the build emit a single clear error
# (rather than a cascade of unresolved-Prng errors) when none is selected. MWC features
# also enable the internal _mwc marker, so that MWCX and LACUNARY can check that an MWC
# generator is selected; similarly, RANLUX features enable the internal _ranlux marker.
# Do not enable _prng, _mwc, or _ranlux directly.
#
# MWCX is not a generator: combined with an MWC feature, it applies the scrambler X
# (output digit xored with the carry) to its output. LACUNARY is not a generator
# either: combined with an MWC feature with lag k (and possibly MWCX), it returns the
# outputs of index 0, 1, and k + 1 of each block of k + 2, so that a three-dimensional
# test (the only one accepted) tests the lacunary triples (x[n], x[n + 1], x[n + k + 1]).
# Combined with a RANLUX feature, it returns instead the outputs involved in a sparse
# linear relation among those kept by the generator, and the only test accepted is that
# whose dimension is the weight of the relation.

[features]
_prng = []
_mwc = []
_ranlux = []
MWCX = []
LACUNARY = []
mwc_128_64_0xff96d28c3f3329da = ["_prng", "_mwc"]
mwc_128_64_0xffebb71d94fcdaf9 = ["_prng", "_mwc"]
mwc_128_64_0xff6da236274e252e = ["_prng", "_mwc"]
mwc_192_64_0xffa04e67b3c95d86 = ["_prng", "_mwc"]
mwc_192_64_0xff4e24dd418f5433 = ["_prng", "_mwc"]
mwc_256_64_0xfff62cf2ccc0cdaf = ["_prng", "_mwc"]
mwc_256_64_0xff32e7e2bdcb0a33 = ["_prng", "_mwc"]
mwc_128_32_0xfffea2df = ["_prng", "_mwc"]
mwc_128_32_0xffcccc66 = ["_prng", "_mwc"]
splitmix = ["_prng"]
incr = ["_prng"]
wyrand = ["_prng"]
wyrand-reinerp = ["_prng"]
romuduo = ["_prng"]
romuduojr = ["_prng"]
romutrio = ["_prng"]
romutrio32 = ["_prng"]
lcg_32_32_0xec65035 = ["_prng"]
lcg_32_32_0x915f77f5 = ["_prng"]
lcg_64_64_0xa5b9ee81534fa94d = ["_prng"]
MSWS-CTR = ["_prng"]
ranlux_0 = ["_prng", "_ranlux"]
ranlux_1 = ["_prng", "_ranlux"]
ranlux_2 = ["_prng", "_ranlux"]
ranlux_3 = ["_prng", "_ranlux"]
ranlux_4 = ["_prng", "_ranlux"]
sirius64 = ["_prng"]
